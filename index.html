<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Doxbin Italia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }

        nav {
            background: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        
        .nav-brand a {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
        }
        
        .navbar-toggler {
            display: none;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }
        
        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 25px;
        }
        
        .nav-menu li a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .nav-menu li a:hover,
        .nav-menu li.active a {
            color: #ffffff;
        }
        
        .nav-auth {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 15px;
            align-items: center;
        }
        
        .nav-auth li a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .nav-auth li a:hover {
            color: #ffffff;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background: none;
            border: none;
            color: #2A9FD6;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 12px;
            transition: color 0.2s;
        }

        .dropdown-toggle:hover {
            color: #0da9f8;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            min-width: 150px;
            margin-top: 5px;
            z-index: 1000;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .dropdown-menu a:hover {
            background: #1a1a1a;
            color: #fff;
        }
        
        .online-count {
            display: flex;
            align-items: center;
            color: #00ff00;
            font-size: 12px;
        }
        
        .online-count::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(0, 255, 0, 0); }
        }

        .desktop-only {
            display: flex;
        }

        .mobile-only {
            display: none;
        }

        .logo-container {
            text-align: center;
            margin: 20px 0;
        }

        .logo-container img {
            max-width: 300px;
            height: auto;
        }

        .search-container {
            text-align: center;
            margin: 20px 0;
        }

        .search-form {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .search-box {
            background: #282828;
            border: none;
            color: white;
            padding: 8px 12px;
            width: 240px;
        }

        .search-button {
            background: #282828;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
        }

        .pastes-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        #allPastesTable {
            width: 100%;
            border-collapse: collapse;
            background: #0a0a0a;
        }

        #allPastesTable thead tr {
            background: #1a1a1a;
            border-bottom: 2px solid #2a2a2a;
        }

        #allPastesTable th {
            padding: 12px;
            text-align: left;
            color: #888;
            font-size: 13px;
            font-weight: 600;
        }

        #allPastesTable td {
            padding: 12px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 14px;
        }

        #allPastesTable tbody tr {
            transition: background 0.2s;
        }

        #allPastesTable tbody tr:hover {
            background: #1a1a1a;
        }

        #allPastesTable a {
            color: #2A9FD6;
            text-decoration: none;
        }

        #allPastesTable a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1000px) {
            .navbar-toggler {
                display: block;
            }
            
            .nav-wrapper {
                position: fixed;
                top: 60px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 60px);
                background: #0a0a0a;
                flex-direction: column;
                padding: 20px;
                transition: left 0.3s;
                gap: 20px;
                align-items: flex-start;
            }
            
            .nav-wrapper.show {
                left: 0;
            }
            
            .nav-menu {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }
            
            .nav-auth {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }

            .desktop-only {
                display: none;
            }

            .mobile-only {
                display: flex;
            }

            #allPastesTable {
                font-size: 12px;
            }

            #allPastesTable th,
            #allPastesTable td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">Doxbin Italia</a>
            </div>
            <button class="navbar-toggler" onclick="toggleMenu()">☰</button>
            <div class="nav-wrapper">
                <ul class="nav-menu">
                    <li class="active"><a href="index.html">Home</a></li>
                    <li><a href="upload.html">Add Paste</a></li>
                    <li><a href="/users">Users</a></li>
                </ul>
                <div class="online-count">
                    <span id="onlineCount">0</span>
                </div>
                <div class="nav-auth" id="navAuth">
                </div>
            </div>
        </div>
    </nav>

    <div class="logo-container">
        <img src="https://i.imgur.com/EcJrFdz.png" alt="Doxbin">
    </div>

    <div class="search-container">
        <form class="search-form">
            <input type="text" class="search-box" placeholder="Search for...">
            <button type="submit" class="search-button">Search</button>
        </form>
    </div>

    <div class="pastes-section">
        <table id="allPastesTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Comments</th>
                    <th>Views</th>
                    <th>Created by</th>
                    <th>Added</th>
                </tr>
            </thead>
            <tbody id="pastesTableBody">
            </tbody>
        </table>
    </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// CONFIG — metti le tue chiavi Supabase
const SUPABASE_URL = 'https://xsenbbecfusdvxmkdkqg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZW5iYmVjZnVzZHZ4bWtka3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5NDgxMDUsImV4cCI6MjA3NzUyNDEwNX0.5ufF7abIrQUWuEXADeaBarDB5ajSAaTXNcWQMvMwKvc';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let sessionId = null;

// 🟢 Crea e registra la sessione
async function initSession() {
  sessionId = 'sess_' + Math.random().toString(36).substring(2) + Date.now();

  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const ip = (await res.json()).ip;

    const { data: { session } } = await supabase.auth.getSession();
    const userId = session?.user?.id || null;

    await supabase.from('online_users').insert({
      session_id: sessionId,
      user_id: userId,
      ip_address: ip,
      last_seen: new Date().toISOString()
    });

    // Aggiorna ogni 5 secondi
    setInterval(async () => {
      await supabase.from('online_users')
        .update({ last_seen: new Date().toISOString() })
        .eq('session_id', sessionId);
    }, 5000);

  } catch (err) {
    console.error('Errore initSession:', err);
  }
}

// 🔥 Aggiorna il contatore “Utenti online”
async function updateOnlineCount() {
  try {
    const { data, error } = await supabase
      .from('online_users')
      .select('session_id, last_seen');

    if (error) throw error;

    const now = Date.now();
    const active = data.filter(u => now - new Date(u.last_seen).getTime() < 10000);
    document.getElementById('onlineCount').textContent = active.length;
  } catch (err) {
    console.error('Errore updateOnlineCount:', err);
  }
}

setInterval(updateOnlineCount, 3000);
updateOnlineCount();
initSession();

// 🔴 Cancella sessione all’uscita
window.addEventListener('beforeunload', async () => {
  if (sessionId) {
    await supabase.from('online_users').delete().eq('session_id', sessionId);
  }
});
</script>

</body>
</html>
