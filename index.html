<body>
    <div class="logo-container">
        <img src="https://i.imgur.com/BSYCTwt.jpeg" alt="Doxbin">
    </div>

    <div class="announcements">
        <div class="announcement" style="color: #0da9f8"></div>

    </div>

    <div class="search-container">
        <label class="search-label">Search for a paste</label>
        <form class="search-form">
            <input type="text" class="search-box" placeholder="Search for...">
            <button type="submit" class="search-button">Search</button>
        </form>
    </div>

    <div class="pagination">
        <a href="javascript:void(0)" onclick="changePage(1)">&lt;</a>
        <a href="javascript:void(0)" onclick="changePage(1)" class="active">1</a>
        <a href="javascript:void(0)" onclick="changePage(2)">2</a>
        <a href="javascript:void(0)" onclick="changePage(3)">3</a>
        <a href="javascript:void(0)" onclick="changePage(4)">4</a>
        <a href="javascript:void(0)" onclick="changePage(5)">5</a>
        <a href="javascript:void(0)" onclick="changePage(2)">&gt;</a>
    </div>

    <div class="pinned-pastes">
        <h2>Pinned Pastes</h2>
    </div>

    <div class="all-pastes">
        <table id="allPastesTable">
            <thead>
                <tr>
                    <th>Pastes</th>
                    <th>Comments</th>
                    <th>Views</th>
                    <th>Created by</th>
                    <th>Added</th>
                </tr>
            </thead>
            <tbody id="allPastesBody"></tbody>
        </table>
    </div>

    <div class="showing-text"></div>

    <div id="bottomPagination" class="pagination" style="display: none;"></div>
    <div id="bottomShowingText" class="showing-text" style="display: none;"></div>

    <script>
        function truncateTitle(title) {
            return title.length > 47 ? title.substring(0, 47) + '...' : title;
        }

        let currentPage = 1;
        let currentSearch = '';
        
        async function fetchPastes(page = 1, search = '') {
            const tbody = document.getElementById('allPastesBody');
            tbody.innerHTML = '<tr><td colspan="5" class="loading">Loading pastes...</td></tr>';
        }

        function generatePaginationLinks(current, total) {
            let links = '';
            let start = Math.max(1, current - 2);
            let end = Math.min(total, start + 4);
            
            if (end - start < 4) {
                start = Math.max(1, end - 4);
            }
            
            for (let i = start; i <= end; i++) {
                links += `<a href="javascript:void(0)" onclick="changePage(${i})" ${i === current ? 'class="active"' : ''}>${i}</a>`;
            }
            return links;
        }

        async function changePage(page) {
            currentPage = page;
            await fetchPastes(currentPage, currentSearch);
        }

        const searchForm = document.querySelector('.search-form');
        const searchInput = document.querySelector('.search-box');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            currentSearch = searchInput.value;
            currentPage = 1;
            await fetchPastes(currentPage, currentSearch);
        });

        fetchPastes();
    </script>
</body>
