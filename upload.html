<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload | Doxbin Italia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        input {
            outline: none !important;
            box-shadow: none !important;
        }

        input:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        *:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        input, textarea, select {
            font-size: 16px !important;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .upload-container {
            display: flex;
            height: 100vh;
        }

        .text-area {
            flex: 1;
            background: #0C0C0C;
            position: relative;
        }

        .text-area textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            padding: 10px 20px;
            margin: 0;
            margin-top: 10px;
            white-space: pre;
            tab-size: 4;
            -moz-tab-size: 4;
            word-wrap: break-word;
        }

        .text-area textarea:focus {
            outline: none;
        }

        .sidebar {
            width: 280px;
            background: #181818;
            padding: 10px 12px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            transition: transform 0.3s ease;
            text-align: center;
        }

        .sidebar.hidden {
            transform: translateX(100%);
        }

        .toggle-sidebar {
            position: fixed;
            right: 304px;
            top: 0;
            background: #181818;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            z-index: 1000;
            padding: 6px 10px;
            border-radius: 0;
            transition: right 0.3s ease;
        }

        .toggle-sidebar:hover {
            background: #222;
        }

        .ascii-art {
            color: #fff;
            font-family: monospace;
            white-space: pre;
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 20px;
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group label {
            display: block;
            color: #fff;
            margin-bottom: 5px;
            font-size: 13px;
            text-align: center;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            background: #545454;
            border: 1px solid #282828;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            border-radius: 3px;
        }

        .form-group input::placeholder {
            color: #bfbfbf;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
        }

        .form-group small {
            display: block;
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .notify-followers {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 2px;
        }

        .notify-followers label {
            color: #fff;
            font-size: 13px;
            margin-bottom: 0;
        }

        input[type="checkbox"] {
            margin: 0;
        }

        .button {
            width: 100%;
            background: #545454;
            border: 1px solid #282828;
            color: #fff;
            padding: 8px 0;
            cursor: pointer;
            font-size: 13px;
            border-radius: 3px;
            margin-bottom: 0;
            transition: all 0.2s;
        }

        .button:hover {
            background: #666;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .separator {
            border-top: 2px solid #747474;
            margin: 15px 0;
        }

        *:focus {
            outline: none !important;
        }

        input[type="checkbox"]:checked {
            accent-color: #ff0000;
        }

        .sidebar a {
            color: #888;
            text-decoration: none;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ff0000;
            margin: 10px 0;
            font-size: 13px;
            text-align: center;
        }

        .success-message {
            color: #00ff00;
            margin: 10px 0;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <div class="text-area">
            <textarea name="content" id="pasteContent" spellcheck="false"></textarea>
        </div>
        <button class="toggle-sidebar" style="right: 304px;">☰</button>
        <div class="sidebar">
            <a href="index.html" style="text-decoration: none;">
                <div class="ascii-art">  ____            _     _       
 |  _ \  _____  _| |__ (_)_ __  
 | | | |/ _ \ \/ / '_ \| | '_ \ 
 | |_| | (_) >  <| |_) | | | | |
 |____/ \___/_/\_\_.__/|_|_| |_|</div>
            </a>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <form id="uploadForm" onsubmit="submitPaste(event)">
                <div class="form-group">
                    <label><strong>Title:</strong></label>
                    <input type="text" name="title" id="pasteTitle" placeholder="Paste title (no special chars)">
                </div>

                <div class="separator"></div>

                <div class="notify-followers">
                    <label for="notify"><strong>Notify Followers</strong></label>
                    <input type="checkbox" id="notify" name="notify_followers">
                </div>

                <div class="separator"></div>

                <button type="submit" class="button" id="submitBtn">Create</button>

                <div class="separator"></div>
            </form>
        </div>
    </div>

    <script>
        // Usa window.storage invece di Supabase per evitare CORS
        window.submitPaste = async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('pasteTitle').value.trim();
            const content = document.getElementById('pasteContent').value;
            const notifyFollowers = document.getElementById('notify').checked;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            errorDiv.textContent = '';
            successDiv.textContent = '';

            if (!title) {
                errorDiv.textContent = 'Title is required';
                return;
            }

            if (!content) {
                errorDiv.textContent = 'Content is required';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            try {
                // Genera ID univoco
                const pasteId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                // Prepara i dati del paste
                const pasteData = {
                    id: pasteId,
                    title: title,
                    content: content,
                    created_by: 'Anonymous',
                    views: 0,
                    comments: 0,
                    notify_followers: notifyFollowers,
                    created_at: new Date().toISOString()
                };

                // Salva usando window.storage
                await window.storage.set(`paste:${pasteId}`, JSON.stringify(pasteData), true);

                successDiv.textContent = 'Paste created successfully!';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('Error creating paste:', error);
                errorDiv.textContent = 'An error occurred while creating the paste';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create';
            }
        };

        const toggleButton = document.querySelector('.toggle-sidebar');
        const sidebar = document.querySelector('.sidebar');
        
        toggleButton.addEventListener('click', function() {
            sidebar.classList.toggle('hidden');
            if (sidebar.classList.contains('hidden')) {
                toggleButton.style.right = '0';
            } else {
                toggleButton.style.right = '304px';
            }
        });

        document.querySelector('.text-area textarea').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                
                var start = this.selectionStart;
                var end = this.selectionEnd;
                
                this.value = this.value.substring(0, start) + '\t' + this.value.substring(end);
                
                this.selectionStart = this.selectionEnd = start + 1;
            }
        });
    </script>
</body>
</html>
