<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Doxbin Italia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }

        nav {
            background: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        
        .nav-brand a {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
        }
        
        .navbar-toggler {
            display: none;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }
        
        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 25px;
        }
        
        .nav-menu li a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .nav-menu li a:hover,
        .nav-menu li.active a {
            color: #ffffff;
        }
        
        .nav-auth {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 15px;
            align-items: center;
        }
        
        .nav-auth li a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .nav-auth li a:hover {
            color: #ffffff;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background: none;
            border: none;
            color: #2A9FD6;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 12px;
            transition: color 0.2s;
        }

        .dropdown-toggle:hover {
            color: #0da9f8;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            min-width: 150px;
            margin-top: 5px;
            z-index: 1000;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .dropdown-menu a:hover {
            background: #1a1a1a;
            color: #fff;
        }
        
        .online-count {
            display: flex;
            align-items: center;
            color: #00ff00;
            font-size: 12px;
        }
        
        .online-count::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(0, 255, 0, 0); }
        }

        .desktop-only {
            display: flex;
        }

        .mobile-only {
            display: none;
        }

        .logo-container {
            text-align: center;
            margin: 20px 0;
        }

        .logo-container img {
            max-width: 300px;
            height: auto;
        }

        .search-container {
            text-align: center;
            margin: 20px 0;
        }

        .search-form {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .search-box {
            background: #282828;
            border: none;
            color: white;
            padding: 8px 12px;
            width: 240px;
        }

        .search-button {
            background: #282828;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
        }

        .pastes-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        #allPastesTable {
            width: 100%;
            border-collapse: collapse;
            background: #0a0a0a;
        }

        #allPastesTable thead tr {
            background: #1a1a1a;
            border-bottom: 2px solid #2a2a2a;
        }

        #allPastesTable th {
            padding: 12px;
            text-align: left;
            color: #888;
            font-size: 13px;
            font-weight: 600;
        }

        #allPastesTable td {
            padding: 12px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 14px;
        }

        #allPastesTable tbody tr {
            transition: background 0.2s;
        }

        #allPastesTable tbody tr:hover {
            background: #1a1a1a;
        }

        #allPastesTable a {
            color: #2A9FD6;
            text-decoration: none;
        }

        #allPastesTable a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1000px) {
            .navbar-toggler {
                display: block;
            }
            
            .nav-wrapper {
                position: fixed;
                top: 60px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 60px);
                background: #0a0a0a;
                flex-direction: column;
                padding: 20px;
                transition: left 0.3s;
                gap: 20px;
                align-items: flex-start;
            }
            
            .nav-wrapper.show {
                left: 0;
            }
            
            .nav-menu {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }
            
            .nav-auth {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }

            .desktop-only {
                display: none;
            }

            .mobile-only {
                display: flex;
            }

            #allPastesTable {
                font-size: 12px;
            }

            #allPastesTable th,
            #allPastesTable td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">Doxbin Italia</a>
            </div>
            <button class="navbar-toggler" onclick="toggleMenu()">☰</button>
            <div class="nav-wrapper">
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="upload.html">Add Paste</a></li>
                    <li><a href="#users">Users</a></li>
                </ul>
                <div class="nav-auth" id="navAuth"></div>
            </div>
        </div>
    </nav>

    <div class="logo-container">
        <img src="https://i.imgur.com/EcJrFdz.png" alt="Doxbin">
    </div>

    <div class="search-container">
        <form class="search-form">
            <input type="text" class="search-box" placeholder="Search for...">
            <button type="submit" class="search-button">Search</button>
        </form>
    </div>

    <div class="pastes-section">
        <table id="allPastesTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Comments</th>
                    <th>Views</th>
                    <th>Created by</th>
                    <th>Added</th>
                </tr>
            </thead>
            <tbody id="pastesTableBody">
            </tbody>
        </table>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        const SUPABASE_URL = 'https://xsenbbecfusdvxmkdkqg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZW5iYmVjZnVzZHZ4bWtka3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5NDgxMDUsImV4cCI6MjA3NzUyNDEwNX0.5ufF7abIrQUWuEXADeaBarDB5ajSAaTXNcWQMvMwKvc';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check session and update nav
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            const navAuth = document.getElementById('navAuth');
            
            if (session) {
                const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
                const role = session.user.user_metadata?.role || 'user';
                const roleColors = {
                    owner: '#ff0000',
                    admin: '#800080',
                    premium: '#ffff00',
                    user: '#ffffff'
                };
                const roleColor = roleColors[role] || '#ffffff';

                navAuth.innerHTML = `
                    <li class="dropdown">
                        <button class="dropdown-toggle" onclick="toggleDropdown(event)">
                            <span style="color: ${roleColor};">${username}</span>
                        </button>
                        <div class="dropdown-menu">
                            <a href="settings.html">Settings</a>
                            <a href="#" onclick="handleLogout(event)">Logout</a>
                        </div>
                    </li>
                `;
            } else {
                navAuth.innerHTML = `
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                `;
            }
        }

        // Menu functions
        window.toggleMenu = function() {
            document.querySelector('.nav-wrapper').classList.toggle('show');
        };

        window.toggleDropdown = function(event) {
            event.stopPropagation();
            const menu = event.currentTarget.nextElementSibling;
            menu.classList.toggle('show');
        };

        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });

        window.handleLogout = async function(event) {
            event.preventDefault();
            await supabase.auth.signOut();
            checkSession();
            window.location.reload();
        };

        // Update online count using Supabase
        async function updateOnlineCount() {
            try {
                const thirtySecondsAgo = new Date(Date.now() - 30000).toISOString();
                const { count } = await supabase
                    .from('online_users')
                    .select('*', { count: 'exact', head: true })
                    .gte('last_seen', thirtySecondsAgo);
                document.getElementById('onlineCount').textContent = count || 0;
            } catch (error) {
                console.error('Error updating count:', error);
            }
        }

        // Load pastes
        async function loadPastes() {
            try {
                const { data: pastes, error } = await supabase
                    .from('pastes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const tbody = document.getElementById('pastesTableBody');
                tbody.innerHTML = '';

                pastes.forEach(paste => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><a href="#" onclick="viewPaste('${paste.id}')">${paste.title || 'Untitled'}</a></td>
                        <td>${paste.comments || 0}</td>
                        <td>${paste.views || 0}</td>
                        <td>${paste.created_by}</td>
                        <td>${new Date(paste.created_at).toLocaleDateString()}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading pastes:', error);
            }
        }

        window.viewPaste = function(id) {
            // For now, alert or redirect to a paste view page
            alert(`Viewing paste ID: ${id}`);
            // Later: window.location.href = `paste.html?id=${id}`;
        };

        // Search functionality
        document.querySelector('.search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.querySelector('.search-box').value.toLowerCase();
            const rows = document.querySelectorAll('#pastesTableBody tr');
            rows.forEach(row => {
                const title = row.cells[0].textContent.toLowerCase();
                row.style.display = title.includes(query) ? '' : 'none';
            });
        });

        // Init
        checkSession();
        loadPastes();
        updateOnlineCount();
        setInterval(updateOnlineCount, 5000);

        // Listen for auth changes
        supabase.auth.onAuthStateChange((event, session) => {
            checkSession();
            if (event === 'SIGNED_IN') {
                loadPastes();
            }
        });
    </script>


</body>
</html>
