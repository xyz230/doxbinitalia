    <script type="module">
        // Supabase Configuration
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        const SUPABASE_URL = 'https://xsenbbecfusdvxmkdkqg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZW5iYmVjZnVzZHZ4bWtka3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5NDgxMDUsImV4cCI6MjA3NzUyNDEwNX0.5ufF7abIrQUWuEXADeaBarDB5ajSAaTXNcWQMvMwKvc';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Track online users
        let sessionId = null;
        let heartbeatInterval = null;

        async function initSession() {
            // Generate unique session ID
            sessionId = 'session_' + Math.random().toString(36).substr(2, 9) + Date.now();
            
            // Get user's IP (approximate)
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIp = data.ip;

                // Insert session into Supabase
                await supabase.from('online_users').insert({
                    session_id: sessionId,
                    ip_address: userIp,
                    last_seen: new Date().toISOString()
                });

                // Send heartbeat every 5 seconds
                heartbeatInterval = setInterval(async () => {
                    await supabase.from('online_users').update({
                        last_seen: new Date().toISOString()
                    }).eq('session_id', sessionId);
                }, 5000);

                // Update count
                updateOnlineCount();
                setInterval(updateOnlineCount, 1000);
            } catch (error) {
                console.error('Error initializing session:', error);
            }
        }

        async function updateOnlineCount() {
            try {
                // Get count of users active in last 30 seconds
                const thirtySecondsAgo = new Date(Date.now() - 30000).toISOString();
                const { count } = await supabase
                    .from('online_users')
                    .select('*', { count: 'exact', head: true })
                    .gte('last_seen', thirtySecondsAgo);

                const onlineCount = count || 0;
                document.getElementById('onlineCountMobile').textContent = onlineCount;
                document.getElementById('onlineCountDesktop').textContent = onlineCount;
            } catch (error) {
                console.error('Error updating count:', error);
            }
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', async () => {
            if (sessionId) {
                await supabase.from('online_users').delete().eq('session_id', sessionId);
            }
        });

        // Initialize
        initSession();

        // Menu toggle
        window.toggleMenu = function() {
            document.querySelector('.nav-wrapper').classList.toggle('show');
        };

        // Page functions
        function truncateTitle(title) {
            return title.length > 47 ? title.substring(0, 47) + '...' : title;
        }

        let currentPage = 1;
        let currentSearch = '';
        
        async function fetchPastes(page = 1, search = '') {
            const tbody = document.getElementById('allPastesBody');
            tbody.innerHTML = '<tr><td colspan="5" class="loading">Loading pastes...</td></tr>';
        }

        function generatePaginationLinks(current, total) {
            let links = '';
            let start = Math.max(1, current - 2);
            let end = Math.min(total, start + 4);
            
            if (end - start < 4) {
                start = Math.max(1, end - 4);
            }
            
            for (let i = start; i <= end; i++) {
                links += `<a href="javascript:void(0)" onclick="changePage(${i})" ${i === current ? 'class="active"' : ''}>${i}</a>`;
            }
            return links;
        }

        window.changePage = async function(page) {
            currentPage = page;
            await fetchPastes(currentPage, currentSearch);
        };

        const searchForm = document.querySelector('.search-form');
        const searchInput = document.querySelector('.search-box');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            currentSearch = searchInput.value;
            currentPage = 1;
            await fetchPastes(currentPage, currentSearch);
        });

        fetchPastes();
    </script>
</body>
</html>
